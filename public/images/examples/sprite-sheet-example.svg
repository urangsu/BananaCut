<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="checker" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f0f0f0" />
      <rect width="10" height="10" fill="#d1d5db" />
      <rect x="10" y="10" width="10" height="10" fill="#d1d5db" />
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#checker)" />
  <g fill="#ec4899">
    <circle cx="50" cy="100" r="30" />
    <circle cx="150" cy="80" r="30" />
    <circle cx="250" cy="60" r="30" />
    <circle cx="350" cy="80" r="30" />
    <circle cx="50" cy="200" r="30" />
    <circle cx="150" cy="220" r="30" />
    <circle cx="250" cy="240" r="30" />
    <circle cx="350" cy="220" r="30" />
  </g>
  <text x="200" y="160" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#000">Sprite Sheet Export</text>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#000" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="200" y1="0" x2="200" y2="300" stroke="#000" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="300" y1="0" x2="300" y2="300" stroke="#000" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="0" y1="150" x2="400" y2="150" stroke="#000" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
</svg>
